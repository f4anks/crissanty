<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Mission</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400&display=swap');
:root{--b:#0062FF;--n:#050A30;--w:#FFF}
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Inter';background:#F8FAFC}
.h{background:linear-gradient(rgba(5,10,48,.7),rgba(5,10,48,.7)),url('img/mision.png');background-size:cover;background-position:center;padding:80px 20px;text-align:center;border-bottom-left-radius:40px;border-bottom-right-radius:40px;color:var(--w);position:relative}
.a{position:absolute;top:20px;left:20px;color:#FFF;text-decoration:none;background:rgba(255,255,255,.2);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;backdrop-filter:blur(5px)}
h1{font-family:'Montserrat';text-transform:uppercase;font-size:1.8rem}
main{padding:30px 20px;min-height:60vh}
.card{background:#FFF;padding:25px;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,.05);line-height:1.6;color:#64748B}
.card h2{color:var(--b);margin-bottom:10px;font-family:'Montserrat'}
.btn{display:block;margin-top:20px;background:var(--n);color:#FFF;text-align:center;padding:15px;border-radius:15px;text-decoration:none;font-weight:700}
footer{text-align:center;padding:25px;background:#FFF;border-top:1px solid #EEE}
.dev{color:var(--b);font-weight:700}
</style>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.onkeydown=function(e){if(e.keyCode==123||e.keyCode==116)return false;};
</script>
</head>
<body>
<header class="h"><a href="index.html" class="a">←</a><h1>Our Mission</h1></header>
<main><div class="card"><h2>Empowering You</h2><p>Our mission is to provide high-level advisory for entrepreneurs to scale their investments through data-driven orientation.</p></div><a href="index.html" class="btn">BACK TO MENU</a></main>
<footer><p>© 2026 Crissanty Blue. All Rights Reserved.</p><p style="font-size:.7rem;margin-top:5px">Developed by <span class="dev">Sistematikos</span></p></footer>
</body>
</html>
