<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Contact | CRISSANTY BLUE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&display=swap');
:root{--b:#0062FF;--n:#050A30;--g:#F8FAFC;--w:#FFF;--s:#64748B;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;user-select:none}
body{font-family:'Inter',sans-serif;background:var(--g);color:var(--n);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

.h{background:linear-gradient(135deg,var(--n),var(--b));padding:45px 20px;text-align:center;border-bottom-left-radius:40px;border-bottom-right-radius:40px;color:var(--w);position:relative;box-shadow:0 10px 20px rgba(0,98,255,.2);animation:fIn 0.6s}
.back{position:absolute;top:20px;left:20px;color:var(--w);text-decoration:none;background:rgba(255,255,255,.15);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.h h1{font-family:'Montserrat';font-size:1.8rem;text-transform:uppercase}

main{padding:25px;flex:1;animation:sUp 0.7s ease-out}
.i-card{background:var(--w);padding:30px 20px;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.05);text-align:center}
.i-card h3{font-family:'Montserrat';font-size:.8rem;color:var(--n);text-transform:uppercase;margin-top:20px;margin-bottom:5px}
.i-card p{font-size:.95rem;color:var(--s);margin-bottom:15px}

.ws-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--wa);color:var(--w);padding:18px;border-radius:18px;text-decoration:none;font-family:'Montserrat';font-weight:700;text-transform:uppercase;box-shadow:0 8px 20px rgba(37,211,102,0.3);transition:.2s;margin-top:10px}
.ws-btn:active{transform:scale(.96)}

footer{text-align:center;padding:30px;background:var(--w);border-top:1px solid #EEE}
.f1{font-size:.85rem;font-weight:700;color:var(--n);text-transform:uppercase}
.dev{color:var(--b);font-weight:700}

@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes sUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body oncontextmenu="return false">

            Connect to WhatsApp

    </div>

<footer>
    <p class="f1">© 2026 Crissanty Blue. All Rights Reserved.</p>
    <p style="font-size:.7rem; color:var(--s); margin-top:5px">Developed by <span class="dev">Sistematikos</span></p>

</body>
</html>
